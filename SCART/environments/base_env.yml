name: package_env

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.9
  - pip

  # core scientific stack
  - numpy=1.23.4
  - scipy=1.13.1
  - pandas=2.1.4
  - scikit-learn=1.2.2
  - numba=0.56.4
  - h5py=3.7.0

  # visualization
  - matplotlib=3.6.3
  - seaborn=0.13.2

  # utilities
  - requests
  - tqdm
  - pyyaml

  - pip:
      # single-cell ecosystem
      - anndata==0.9.1
      - deap==1.4.3
      - geofetch==0.12.10
      - geoparse==2.0.4
      - scanpy==1.9.3
      - scanpy==1.9.3
      - scanorama==1.7.4
      - bbknn==1.6.0
      - scgen==2.1.1
      - scib==1.1.7
      - scvi-tools==1.1.6.post2
      - scrublet==0.2.3
      - popv==0.4.2
      - scmalignantfinder==1.0.1
      - celltypist==1.7.1
      - gseapy==1.1.11
      - umap-learn==0.5.7
      - harmonypy==0.0.10
      - harmony-pytorch==0.1.8

      # ML / DL
      - torch==2.6.0
      - pytorch-lightning==2.5.2
      - tensorflow==2.19.0
      - jax==0.4.30
      - jaxlib==0.4.30
      - flax==0.8.5
      - optax==0.2.4

      # analysis utilities
      - statsmodels==0.14.5
      - scikit-image==0.24.0
      - networkx==3.2.1
      - igraph==0.11.9
      - leidenalg==0.10.2
      - louvain==0.8.2

      # transformers / embeddings
      - transformers==4.53.2
      - sentence-transformers==5.0.0

      # misc utilities
      - joblib
      - rich
      - typer
      - pydantic